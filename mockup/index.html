<title>Tip Jar Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: role switcher on top; a phone frame for guest/attendant (or a wide panel for company) beside a notes column. Valet-stand palette: course green, key-tag brass. */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --sunk: #e3e8e2;
  --ink: #14211b;
  --muted: #5b6b62;
  --line: #cfd8d1;
  --green: #0f4a36;
  --green-ink: #ffffff;
  --brass: #b88a12;
  --brass-soft: #f5e9c4;
  --good: #1d7a4c;
  --warn: #a35a00;
  --phone: #0d1512;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1310; --surface: #13201b; --sunk: #1a2a23; --ink: #e6eee8; --muted: #9aaba1; --line: #2a3b33;
  --green: #3fae7f; --green-ink: #06140e; --brass: #e0b941; --brass-soft: #3a3115; --good: #4fc98a; --warn: #f0a24a; --phone: #000000;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1310; --surface: #13201b; --sunk: #1a2a23; --ink: #e6eee8; --muted: #9aaba1; --line: #2a3b33;
  --green: #3fae7f; --green-ink: #06140e; --brass: #e0b941; --brass-soft: #3a3115; --good: #4fc98a; --warn: #f0a24a; --phone: #000000;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .5px; text-transform: uppercase; }
.brand span { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.roles { display: flex; background: var(--sunk); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.roles button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.roles button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.stage { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 32px; align-items: start; }
.stage.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* Phone */
.phone { width: 100%; max-width: 380px; margin: 0 auto; background: var(--phone); border-radius: 46px; padding: 12px; box-shadow: 0 20px 50px rgba(10,30,20,.25); }
.screen { background: var(--surface); border-radius: 36px; height: 720px; max-height: calc(100vh - 140px); min-height: 600px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.status { display: flex; justify-content: space-between; padding: 12px 26px 4px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.body { flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); padding: 8px 8px 18px; }
.tabs button { border: 0; background: none; padding: 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button[aria-current="page"] { color: var(--green); }
.tabs svg { width: 22px; height: 22px; }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
.mid { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
h2 { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .5px; margin: 0; line-height: 1.05; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 0; border-radius: 16px; padding: 16px; font-weight: 600; font-size: 16px; background: var(--sunk); width: 100%; }
.btn.primary { background: var(--green); color: var(--green-ink); }
.btn.pay { background: var(--ink); color: var(--surface); font-size: 18px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--muted); padding: 10px; }
.btn.huge { padding: 28px 16px; font-size: 20px; border-radius: 22px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--green); color: var(--green-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; flex: none; }
.avatar.sm { width: 34px; height: 34px; font-size: 15px; }
.avatar.lg { width: 84px; height: 84px; font-size: 34px; }

.presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.preset { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 18px 8px; font-family: var(--display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; }
.preset[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: var(--green-ink); }
.preset.other { font-family: var(--body); font-size: 16px; font-weight: 600; }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--sunk); border-radius: 14px; font-size: 14px; }
.switch { width: 44px; height: 26px; border-radius: 13px; background: var(--line); border: 0; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { left: 21px; }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { border: 0; background: var(--sunk); border-radius: 14px; padding: 14px; font-size: 22px; font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--brass-soft); color: var(--ink); font-size: 12px; font-weight: 600; }
.chip.green { background: var(--green); color: var(--green-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

/* Valet claim-ticket receipt */
.ticket { background: var(--brass-soft); border-radius: 14px; padding: 18px; position: relative; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 62%; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); }
.ticket::before { left: -9px; } .ticket::after { right: -9px; }
.ticket .perf { border-top: 2px dashed var(--brass); margin: 14px 0; opacity: .6; }
.ticket .no { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--brass); }

.list { display: flex; flex-direction: column; }
.list .item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list .item:last-child { border-bottom: 0; }
.amt { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--sunk); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 2px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.num-in { width: 64px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font-family: var(--mono); }

.pool { background: var(--green); color: var(--green-ink); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.pool .eyebrow { color: inherit; opacity: .75; }

.tapzone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.rings { width: 150px; height: 150px; position: relative; display: grid; place-items: center; }
.rings span { position: absolute; inset: 0; border: 3px solid var(--green); border-radius: 50%; animation: pulse 1.8s ease-out infinite; opacity: 0; }
.rings span:nth-child(2) { animation-delay: .6s; } .rings span:nth-child(3) { animation-delay: 1.2s; }
.rings svg { width: 54px; height: 54px; color: var(--green); }
@keyframes pulse { from { transform: scale(.4); opacity: .9; } to { transform: scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rings span { animation: none; opacity: .35; } .rings span:nth-child(2) { transform: scale(.7); } .rings span:nth-child(3) { transform: scale(.4); } }

.sheet-bg { position: absolute; inset: 0; background: rgba(5,15,10,.45); display: flex; align-items: flex-end; }
.sheet { background: var(--surface); width: 100%; border-radius: 26px 26px 36px 36px; padding: 22px 20px 26px; display: flex; flex-direction: column; gap: 12px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.code-in { font-family: var(--mono); font-size: 28px; letter-spacing: .4em; text-align: center; padding: 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); width: 100%; }

/* Notes column */
.notes { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.notes h1 { font-family: var(--display); font-weight: 800; font-size: 40px; text-transform: uppercase; line-height: 1; margin: 0; text-wrap: balance; }
.notes .lede { font-size: 17px; max-width: 58ch; }
.notes ol, .notes ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.ask { border-left: 4px solid var(--brass); }

/* Company dashboard */
.dash { display: flex; flex-direction: column; gap: 20px; }
.dash-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: end; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
tfoot td { font-weight: 600; border-bottom: 0; }
.btn.inline { width: auto; padding: 12px 18px; font-size: 15px; border-radius: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 13px; font-weight: 600; }
select { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
.checks label { display: flex; gap: 6px; align-items: center; }
.banner { background: var(--brass-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.ok { color: var(--good); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }
.example { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Tip Jar</b><span>Clickable prototype · mock data</span></div>
    <nav class="roles" aria-label="Choose a view">
      <button data-role="guest">Guest tipping</button>
      <button data-role="work">Attendant app</button>
      <button data-role="co">Company dashboard</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
const $ = (c) => '$' + (c / 100).toFixed(2).replace(/\.00$/, '');
const $2 = (c) => '$' + (c / 100).toFixed(2);
const fee = (c) => Math.round(c * 0.029) + 30 + 25; // example card fee + 25¢ Tip Jar fee, not real pricing
const initials = (n) => n.replace(/^You \(|\)$/g, '').split(' ').map(w => w[0]).join('').slice(0, 2);
const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

const S = {
  role: 'guest',
  guest: { step: 'pick', amount: 1000, other: false, entry: '', cover: true },
  work: {
    tab: 'tips', step: 'home', entry: '', guestPicks: false, sheet: null, last: null, joinCode: '',
    inCrew: false, cashed: 0, crewShare: 0,
    tips: [
      { amt: 500, src: 'Apple Pay', t: '11:52 AM', crew: false },
      { amt: 2000, src: 'Visa ••42', t: '12:30 PM', crew: false },
      { amt: 1000, src: 'Badge tap · Google Pay', t: '1:15 PM', crew: false },
    ],
  },
  crew: {
    name: 'Harbor Valet · Friday', code: '4821', mode: 'even', closed: null,
    pool: 38600,
    members: [
      { id: 'dani', name: 'Dani Reyes', role: 'Lead', hours: 8, shares: 1.5, pct: 30 },
      { id: 'luis', name: 'Luis Moreno', role: 'Valet', hours: 8, shares: 1, pct: 25 },
      { id: 'priya', name: 'Priya Shah', role: 'Runner', hours: 4, shares: 0.5, pct: 20 },
    ],
  },
  co: { paid: false, confirm: false, saved: false, loc: 'harbor', mode: 'hours', excl: { Manager: true, Supervisor: true }, autojoin: true },
};
const ME = { id: 'me', name: 'You (Marcus)', role: 'Valet', hours: 6.5, shares: 1, pct: 25 };

/* Split a pool (in cents) by weights. Leftover cents go one at a time in rotating order starting at `start`. */
function split(cents, weights, start = 0) {
  const sum = weights.reduce((a, b) => a + b, 0);
  if (!sum) return weights.map(() => 0);
  const out = weights.map(w => Math.floor(cents * w / sum));
  let left = cents - out.reduce((a, b) => a + b, 0);
  for (let i = 0; left > 0; i++, left--) out[(start + i) % out.length]++;
  return out;
}
function crewMembers() { return S.work.inCrew ? [ME, ...S.crew.members] : S.crew.members; }
function weightsFor(mode, ms) {
  return ms.map(m => mode === 'even' ? 1 : mode === 'hours' ? m.hours : mode === 'shares' ? m.shares : m.pct);
}
function pctTotal() { return crewMembers().reduce((a, m) => a + Number(m.pct || 0), 0); }

const icon = {
  tips: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></svg>',
  crew: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2A5 5 0 0 1 21.5 19"/></svg>',
  earn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',
  tap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 7a7 7 0 0 1 0 10M12 4.5a11 11 0 0 1 0 15M5 9.5a3.5 3.5 0 0 1 0 5"/></svg>',
  apple: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.5-1-2.5-3.6zM14.1 5.5c.6-.8 1.1-1.8 1-2.9-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>',
};

function phone(inner, tabs) {
  return `<div class="phone"><div class="screen">
    <div class="status"><span>${clock()}</span><span>5G ▮▮▮</span></div>
    ${inner}${tabs ? tabBar() : ''}
  </div></div>`;
}
function tabBar() {
  const t = S.work.tab;
  const b = (id, label) => `<button data-act="tab" data-v="${id}" ${t === id ? 'aria-current="page"' : ''}>${icon[id]}${label}</button>`;
  return `<nav class="tabs">${b('tips', 'Tips')}${b('crew', 'Crew')}${b('earn', 'Earnings')}</nav>`;
}
function keypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  return `<div class="keypad">${keys.map(k => `<button data-act="key" data-v="${k}" aria-label="${k === '⌫' ? 'Delete' : k}">${k}</button>`).join('')}</div>`;
}
function entryCents(s) { const n = parseFloat(s); return isNaN(n) ? 0 : Math.round(n * 100); }

/* ---------- Guest ---------- */
function guestView() {
  const g = S.guest;
  if (g.step === 'processing') return phone(`<div class="body"><div class="tapzone"><div class="rings"><span></span><span></span><span></span>${icon.apple.replace('width="20" height="20"', 'width="54" height="54"')}</div><p class="muted">Confirming with Apple Pay…</p></div></div>`);
  if (g.step === 'done') {
    const total = g.amount + (g.cover ? fee(g.amount) : 0);
    return phone(`<div class="body">
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px">
        <h2>Thanks! Marcus got your tip.</h2>
        <div class="ticket">
          <div class="row between"><span class="no">TIP CLAIM № 004417</span><span class="chip">Paid</span></div>
          <div class="big" style="margin-top:10px">${$(g.amount)}</div>
          <p class="small">to Marcus at The Harbor Hotel valet</p>
          <div class="perf"></div>
          <div class="row between small"><span>Charged to Apple Pay</span><span class="amt">${$2(total)}</span></div>
          ${g.cover ? `<div class="row between small muted"><span>Fees you covered</span><span class="amt">${$2(fee(g.amount))}</span></div>` : ''}
        </div>
        <button class="btn" data-act="g-receipt">Email me a receipt</button>
      </div>
      <button class="btn ghost" data-act="g-reset">Start over (demo)</button>
    </div>`);
  }
  const amt = g.other ? entryCents(g.entry) : g.amount;
  const presets = [500, 1000, 2000].map(c => `<button class="preset" data-act="g-amt" data-v="${c}" aria-pressed="${!g.other && g.amount === c}">${$(c)}</button>`).join('');
  return phone(`<div class="body">
    <div class="row" style="margin-top:6px">
      <div class="avatar lg">M</div>
      <div class="stack" style="gap:4px">
        <h2>Tip Marcus</h2>
        <p class="muted small">Valet · The Harbor Hotel</p>
        <span class="chip"><span class="dot"></span>On shift now</span>
      </div>
    </div>
    <p class="small muted" style="margin-top:-6px">Marcus shares tips with his crew today.</p>
    ${g.other ? `
      <div class="stack" style="gap:8px">
        <div class="row between"><span class="eyebrow">Custom amount</span><button class="btn ghost" style="width:auto;padding:4px" data-act="g-presets">Back to presets</button></div>
        <div class="big" style="text-align:center">${g.entry ? '$' + g.entry : '$0'}</div>
        ${keypad()}
      </div>` : `
      <div class="presets">${presets}<button class="preset other" data-act="g-other" aria-pressed="false">Other</button></div>`}
    <div class="toggle"><span>Cover the ${amt ? $2(fee(amt)) : ''} in fees so Marcus gets the full ${amt ? $(amt) : 'tip'}</span><button class="switch" role="switch" aria-label="Cover fees" aria-checked="${g.cover}" data-act="g-cover"></button></div>
    <div style="margin-top:auto" class="stack">
      <button class="btn pay" data-act="g-pay" ${amt ? '' : 'disabled'}>Pay ${amt ? $2(amt + (g.cover ? fee(amt) : 0)) : ''} with ${icon.apple}Pay</button>
      <p class="small muted" style="text-align:center">No app or account needed. Opened by scanning Marcus's QR code.</p>
    </div>
  </div>`);
}

/* ---------- Attendant ---------- */
function soloTotal() { return S.work.tips.reduce((a, t) => a + t.amt, 0); }
function workView() {
  const w = S.work;
  let inner = '';

const app = document.getElementById('app');
function render() {
  document.querySelectorAll('.roles button').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === S.role));
  if (S.role === 'co') app.innerHTML = `<div class="stage wide">${coView()}</div><div class="stage wide" style="margin-top:28px">${notesView()}</div>`;
  else app.innerHTML = `<div class="stage">${S.role === 'guest' ? guestView() : workView()}${notesView()}</div>`;
}
function addTip(amt, src) {
  const w = S.work, t = { amt, src, t: clock(), crew: w.inCrew && !S.crew.closed };
  w.tips.push(t); w.last = t;
  if (t.crew) S.crew.pool += amt;
}
function type(target, k) {
  let s = target.entry;
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === '.') { if (!s.includes('.')) s = (s || '0') + '.'; }
  else if (!/\.\d\d$/.test(s) && s.replace('.', '').length < 5) s = s === '0' ? k : s + k;
  target.entry = s;
}

document.addEventListener('click', (e) => {
  const roleBtn = e.target.closest('[data-role]');
  if (roleBtn) { S.role = roleBtn.dataset.role; return render(); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'sheet-close' && e.target.closest('[data-stop]') && el.classList.contains('sheet-bg')) return;
  const a = el.dataset.act, v = el.dataset.v, g = S.guest, w = S.work, c = S.crew, o = S.co;
  switch (a) {
    case 'g-amt': g.amount = +v; g.other = false; break;
    case 'g-other': g.other = true; g.entry = ''; break;
    case 'g-presets': g.other = false; break;
    case 'g-cover': g.cover = !g.cover; break;
    case 'g-pay': if (g.other) g.amount = entryCents(g.entry); g.step = 'processing'; setTimeout(() => { g.step = 'done'; render(); }, 1100); break;
    case 'g-receipt': el.textContent = 'Receipt sent (demo)'; return;
    case 'g-reset': Object.assign(g, { step: 'pick', amount: 1000, other: false, entry: '' }); break;
    case 'key': type(S.role === 'guest' ? g : w, v); break;
    case 'tab': w.tab = v; w.step = 'home'; w.last = null; break;
    case 'w-accept': w.step = 'amount'; w.entry = ''; w.last = null; break;
    case 'w-preset': w.entry = String(+v / 100); break;
    case 'w-ready': w.guestPicks = false; w.step = 'tap'; break;
    case 'w-guest': w.guestPicks = true; w.step = 'tap'; break;
    case 'w-cancel': w.step = 'home'; break;
    case 'w-tapped': {
      const amt = w.guestPicks ? 1000 : entryCents(w.entry);
      addTip(amt, ['Apple Pay', 'Visa ••8812', 'Google Pay', 'Amex ••1004'][w.tips.length % 4]);
      w.step = 'home';
      if (!w.inCrew && !c.closed && !w.declined) w.sheet = 'join';
      break;
    }
    case 'sheet-close': w.sheet = null; w.declined = true; break;
    case 'c-join': w.inCrew = true; w.sheet = null; w.tab = 'crew'; w.step = 'home'; break;
    case 'c-code': w.sheet = 'code'; break;
    case 'c-start': w.sheet = 'start'; break;
    case 'c-leave': w.inCrew = false; break;
    case 'c-mode': c.mode = v; break;
    case 'c-close': {
      const ms = crewMembers(), sh = split(c.pool, weightsFor(c.mode, ms));
      c.closed = ms.map((m, i) => ({ name: m.name, cents: sh[i] }));
      c.closed.modeLabel = { even: 'split evenly', hours: 'split by hours', shares: 'split by shares', custom: 'custom %' }[c.mode];
      w.crewShare = sh[0];
      break;
    }
    case 'c-reset': c.closed = null; c.pool = 38600; w.inCrew = false; w.crewShare = 0; w.tips.forEach(t => t.crew = false); w.declined = false; break;
    case 'e-instant': { const bal = balance(), f = Math.max(50, Math.round(bal * 0.015)); w.cashed += bal; w.cashedMsg = `${$2(bal - f)} to Visa debit ••42`; break; }
    case 'co-confirm': o.confirm = true; break;
    case 'co-cancel': o.confirm = false; break;
    case 'co-pay': o.paid = true; o.confirm = false; break;
    case 'co-export': o.exported = true; break;
    case 'co-mode': o.mode = v; o.saved = false; break;
    case 'co-auto': o.autojoin = !o.autojoin; o.saved = false; break;
    case 'co-ex': o.excl[v] = el.checked; o.saved = false; break;
    case 'co-save': o.saved = true; break;
    default: return;
  }
  render();
});
document.addEventListener('change', (e) => {

  if (el.dataset.act === 'co-loc') { S.co.loc = el.value; S.co.mode = el.value === 'harbor' ? 'hours' : 'shares'; S.co.saved = false; render(); }
});
document.addEventListener('input', (e) => { if (e.target.dataset.act === 'code-in') S.work.joinCode = e.target.value.replace(/\D/g, ''); });
render();
